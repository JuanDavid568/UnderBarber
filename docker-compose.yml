# Para probar todo en tu computador:  docker compose up --build   →  http://localhost:3000
# (cuentas de prueba en el README; NODE_ENV=development solo para uso local)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: underbarber
      POSTGRES_PASSWORD: underbarber
      POSTGRES_DB: underbarber
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underbarber"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://underbarber:underbarber@db:5432/underbarber
      JWT_SECRET: cambia-esto-por-un-secreto-largo-en-produccion
    ports:
      - "3000:3000"

volumes:
  dbdata:
